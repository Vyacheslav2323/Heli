<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thin Client Composer</title>
  </head>
  <body>
    <div id="app">
      <canvas id="sceneCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <label id="gizmoToggle">
        <input id="gizmoCheckbox" type="checkbox" checked />
        Gizmo
      </label>
      <div id="healthStrip"></div>
      <div id="alerts"></div>
      <section id="chatDock">
        <div id="chatMessages"></div>
        <div id="chatControls">
          <button id="micButton" type="button">Start Mic</button>
          <input id="chatInput" type="text" placeholder="Type a message" />
          <button id="sendButton" type="button">Send</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
